name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # MySQL 8.0.16+ is the version floor schema.sql itself calls out — CHECK
    # constraints are silently no-ops below .16, so this pins well above it
    # rather than trusting a generic "8.0" tag.
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: laundry_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Generate app key
        run: php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && break
            sleep 2
          done

      # Fails loudly if any migration errors on a real MySQL instance —
      # catches exactly the class of issue MASTER_SPECIFICATION.md §9 Phase 1
      # flags as "will happen on the first real run" (triggers/CHECK
      # constraints/EVENT definitions that have never executed anywhere).
      - name: Migration-fresh check
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laundry_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate:fresh --force

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laundry_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test
